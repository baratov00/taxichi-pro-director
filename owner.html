<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taxichi Pro — кабинет директора</title><link rel="icon" href="taxichi-pro-logo.png"><link rel="apple-touch-icon" href="taxichi-pro-logo.png"><link rel="stylesheet" href="owner.css"><link rel="stylesheet" href="owner-analytics.css"></head><body>
<section id="ownerLogin" class="login"><form id="ownerLoginForm" class="login-card"><img src="taxichi-pro-logo.png"><h1>Кабинет директора</h1><p>Управление доступом админов</p><label>Почта<input name="email" type="email" required autocomplete="username" value="baratov329@mail.ru"></label><label>Пароль<input name="password" type="password" required autocomplete="current-password"></label><div id="ownerError" class="error"></div><button>Войти</button><button type="button" id="forgotOwnerPassword" class="link-button">Сбросить пароль через почту</button></form></section>
<div id="ownerApp" class="app hidden"><aside><div class="brand"><img src="taxichi-pro-logo.png"><span class="brand-copy"><b>Taxichi Pro</b><small>Директор</small></span></div><nav><button class="active" data-owner-page="admins">Админы</button><button data-owner-page="analytics" type="button">Аналитика</button></nav><div class="account"><b>Асадбек Баратов</b><span>Директор</span><button id="ownerLogout">Выйти</button></div></aside><main><header><div><h1 id="ownerTitle">Админы</h1><p id="ownerSubtitle">Доступы для админского кабинета</p></div><button id="addDispatcher" class="primary">+ Добавить админа</button></header><section id="ownerAnalytics" class="owner-analytics-panel hidden"></section><section id="dispatcherGrid" class="dispatcher-list"></section></main></div>
<dialog id="dispatcherDialog"><button class="close">×</button><h2 id="dispatcherDialogTitle">Новый админ</h2><p>Создайте логин и пароль для доступа к админскому кабинету.</p><form id="dispatcherForm"><input type="hidden" name="id"><input type="hidden" name="active" value="true"><div class="form-grid"><label>ФИО<input name="name" required></label><label>Телефон<input name="phone" required placeholder="+7 999 999-99-99"></label><label>Логин<input name="login" required></label><label>Пароль<input name="password" required minlength="4"></label></div><div class="actions edit-actions"><button type="button" class="danger dispatcher-dialog-delete">Удалить</button><button type="button" class="secondary dispatcher-dialog-toggle">Закрыть доступ</button><span class="action-spacer"></span><button type="button" class="cancel">Отмена</button><button type="submit" class="primary">Сохранить доступ</button></div></form></dialog>
<dialog id="ownerResetDialog"><button class="close reset-close">×</button><h2>Сброс пароля директора</h2><p>Введите привязанную почту и новый пароль.</p><form id="ownerResetForm"><div class="form-grid"><label>Почта<input name="email" type="email" required value="baratov329@mail.ru"></label><label>Новый пароль<input name="password" type="password" required minlength="6"></label></div><div id="ownerResetError" class="error"></div><div class="actions"><button type="button" class="cancel reset-cancel">Отмена</button><button type="submit" class="primary">Сбросить пароль</button></div></form></dialog>
<script src="owner.js"></script></body></html>
